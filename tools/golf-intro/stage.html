<!-- First Tee stage: CSS, markup and importmap. Pair with first-tee.js. Expects --gold, --cream, --display, --mono, --sans tokens. -->
<style>
.stage { position: relative; aspect-ratio: 16 / 9; max-width: 100%; border-radius: 6px; overflow: hidden; background: radial-gradient(120% 90% at 50% 100%, #5a4033 0%, #20202c 55%, #0e1018 100%); isolation: isolate; }
@media (max-width: 640px) { .stage { aspect-ratio: 4 / 5; } }
.stage canvas { position: absolute; inset: 0; width: 100% !important; height: 100% !important; display: block; }
.scrim { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(180deg, rgba(8, 8, 12, .28) 0%, rgba(8, 8, 12, 0) 22%, rgba(8, 8, 12, 0) 52%, rgba(8, 8, 12, .62) 100%); opacity: 0; transition: opacity 1.4s ease; }
.stage.titled .scrim { opacity: 1; }
.vignette { position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 160px rgba(0, 0, 0, .45); }

.lockup { position: absolute; left: clamp(18px, 5%, 64px); bottom: clamp(20px, 7%, 60px); right: 18px; display: grid; gap: 12px; pointer-events: none; }
.lockup > * { opacity: 0; transform: translateY(10px); transition: opacity .9s ease, transform 1.1s cubic-bezier(.16, 1, .3, 1); }
.title-mask { overflow: hidden; padding-bottom: .1em; opacity: 1; transform: none; }
.title { font-family: var(--display); font-style: italic; font-weight: 330; font-variation-settings: "opsz" 144; font-size: clamp(40px, 7.6vw, 104px); line-height: .96; letter-spacing: -.012em; color: #f6eedf; text-wrap: balance; transform: translateY(105%); transition: transform 1.3s cubic-bezier(.16, 1, .3, 1) .15s; text-shadow: 0 2px 40px rgba(6, 6, 10, .35); }
.eyebrow { font-family: var(--mono); font-size: clamp(10px, 1.05vw, 12px); letter-spacing: .24em; text-transform: uppercase; color: var(--gold); transition-delay: 0s; }
.rule { height: 1px; width: min(340px, 70%); background: linear-gradient(90deg, var(--gold), rgba(212, 168, 67, 0)); transform-origin: left center; transform: scaleX(0); opacity: 1; transition: transform 1.2s cubic-bezier(.16, 1, .3, 1) .55s; }
.sub { font-size: clamp(12px, 1.3vw, 15px); letter-spacing: .03em; color: #efe6d6; font-variant-numeric: tabular-nums; transition-delay: .75s; }
.stage.titled .lockup > * { opacity: 1; transform: none; }
.stage.titled .title { transform: none; }
.stage.titled .rule { transform: scaleX(1); }

.tracer { position: absolute; top: 14px; left: 14px; display: flex; gap: 14px; flex-wrap: wrap; font: 500 10.5px/1.3 var(--mono); letter-spacing: .16em; text-transform: uppercase; color: rgba(240, 232, 216, .86); opacity: 0; transition: opacity .5s ease; pointer-events: none; font-variant-numeric: tabular-nums; }
.tracer b { color: var(--gold); font-weight: 500; }
.stage.flying .tracer { opacity: 1; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; font: 500 11px/1 var(--mono); letter-spacing: .24em; text-transform: uppercase; color: rgba(232, 220, 200, .7); transition: opacity .6s ease; pointer-events: none; }
.stage.ready .loading { opacity: 0; }

.stage-ctl { position: absolute; top: 10px; right: 10px; z-index: 2; }
.ghost { font: 500 11px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: #efe6d6; background: rgba(20, 18, 16, .4); border: 1px solid rgba(232, 220, 200, .25); border-radius: 999px; padding: 10px 14px; min-height: 40px; cursor: pointer; backdrop-filter: blur(6px); }
.ghost:hover { border-color: var(--gold); }
.ghost:focus-visible, .seg button:focus-visible, .btn:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
</style>
  <div class="stage" id="stage" role="img" aria-label="3D golf intro: a close-up of a ball on the tee at first light, a chase shot of the ball flying over links dunes with a gold tracer, then a wide shot of the green by the sea as the tournament title appears.">
    <div class="loading" id="loading">Setting the pin</div>
    <div class="vignette"></div>
    <div class="scrim"></div>
    <div class="tracer" id="tracer"><span>Shot tracer</span><span>Carry <b id="tCarry">0</b> yds</span><span>Height <b id="tApex">0</b> yds</span><span>Hang <b id="tHang">0.0</b> s</span></div>
    <div class="lockup">
      <div class="eyebrow" id="eyebrow">The Lads Travel Co. · Tournament Guide</div>
      <div class="title-mask"><div class="title" id="title">The Ryder Cup</div></div>
      <div class="rule"></div>
      <div class="sub" id="sub">Adare Manor · Co. Limerick · 13–19 September 2027</div>
    </div>
    <div class="stage-ctl"><button class="ghost" id="skip" type="button">Skip</button></div>
  </div>

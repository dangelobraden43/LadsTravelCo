<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@500;700;800;900&family=Overpass+Mono:wght@500;600&family=Public+Sans:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout: a road atlas you scroll. Elevation profile of the whole drive as the opener, then
   Book, Days (Today opens itself during the trip), the route map, each region with its own map
   and cards nearest-first, the road, hikes, notes, and how the guide was made. */
:root {
  --paper: #edf0ea; --card: #f8f9f5; --land: #e2e7df; --ink: #1a2520; --muted: #55625a; --rule: #cdd4cb;
  --steel: #a8481f; --ridge: #2f5876; --water: #3f7aa3; --sign: #1d5a3a; --sign-ink: #ffffff;
  --ok: #2c6a43; --warn: #8e5f0c; --chip: #e1e6de;
  --c-eat: #b4532a; --c-coffee: #7a5233; --c-drink: #8a3f6b; --c-see: #2f5876; --c-views: #1d6b5a; --c-outdoors: #4d7a2a;
  --l1: #a8481f; --l2: #2f5876; --l3: #1d6b45;
  --display: "Overpass", "Highway Gothic", "Arial Narrow", system-ui, sans-serif;
  --body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Overpass Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #101613; --card: #171f1b; --land: #1d2621; --ink: #e2e7df; --muted: #9aa69e; --rule: #2a342e;
  --steel: #e27b4e; --ridge: #8db2cf; --water: #6aa6d1; --sign: #1f6b45; --sign-ink: #ffffff;
  --ok: #7cc495; --warn: #e2b55c; --chip: #222b26;
  --c-eat: #e27b4e; --c-coffee: #c99a6e; --c-drink: #d37fb0; --c-see: #8db2cf; --c-views: #6fc4ad; --c-outdoors: #9ccc6a;
  --l1: #e27b4e; --l2: #8db2cf; --l3: #7cc495; color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #101613; --card: #171f1b; --land: #1d2621; --ink: #e2e7df; --muted: #9aa69e; --rule: #2a342e;
  --steel: #e27b4e; --ridge: #8db2cf; --water: #6aa6d1; --sign: #1f6b45; --sign-ink: #ffffff;
  --ok: #7cc495; --warn: #e2b55c; --chip: #222b26;
  --c-eat: #e27b4e; --c-coffee: #c99a6e; --c-drink: #d37fb0; --c-see: #8db2cf; --c-views: #6fc4ad; --c-outdoors: #9ccc6a;
  --l1: #e27b4e; --l2: #8db2cf; --l3: #7cc495; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font: 400 16px/1.55 var(--body); margin: 0; }
.wrap { max-width: 900px; margin: 0 auto; padding-inline: 16px; padding-block: 0 64px; }
a { color: var(--ridge); text-underline-offset: 2px; }
a:focus-visible, button:focus-visible, summary:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--steel); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; line-height: 1.1; margin: 0; }
h2 { font-size: clamp(1.5rem, 5vw, 1.9rem); font-weight: 900; letter-spacing: -0.01em; }
h3 { font-size: 1.1rem; font-weight: 800; }
p { margin: 0; }
.eyebrow { font: 700 0.74rem/1.2 var(--display); letter-spacing: 0.13em; text-transform: uppercase; color: var(--muted); }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }

/* hero */
.hero { padding-block: 26px 14px; display: grid; gap: 14px; }
.brand { display: flex; align-items: center; gap: 8px; font: 800 0.78rem/1 var(--display); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.brand i { width: 22px; height: 22px; border-radius: 50%; border: 2px solid currentColor; display: inline-grid; place-items: center; font-style: normal; font-size: 0.6rem; }
.hero h1 { font-size: clamp(2.3rem, 9vw, 4rem); font-weight: 900; letter-spacing: -0.025em; }
.hero h1 .amp { color: var(--steel); }
.hero .lede { color: var(--muted); max-width: 62ch; }
.profile { display: grid; gap: 6px; }
.profile svg { width: 100%; height: auto; display: block; overflow: visible; }
.profile .cap { font: 600 0.8rem/1.4 var(--mono); color: var(--muted); }
.today { background: var(--ink); color: var(--paper); border-radius: 6px; padding: 12px 14px; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; justify-content: space-between; text-decoration: none; }
.today strong { font: 800 1.05rem/1.2 var(--display); }
.today span { font: 600 0.82rem/1.3 var(--mono); opacity: 0.8; }
.bases { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 10px; }
.base { background: var(--card); border: 1px solid var(--rule); border-radius: 6px; padding: 12px 14px; display: grid; gap: 4px; min-width: 0; }
.base .when { font: 600 0.8rem/1.2 var(--mono); color: var(--steel); }
.base .addr { color: var(--muted); font-size: 0.9rem; }

/* tabs */
nav.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); border-bottom: 1px solid var(--rule); margin-inline: -16px; padding-inline: 16px; }
nav.tabs ul { list-style: none; margin: 0; padding: 0; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
nav.tabs ul::-webkit-scrollbar { display: none; }
nav.tabs a { display: block; padding: 13px 10px 10px; font: 800 0.84rem/1 var(--display); letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); text-decoration: none; white-space: nowrap; border-bottom: 3px solid transparent; }
nav.tabs a[aria-current="true"] { color: var(--ink); border-bottom-color: var(--steel); }
section.block { padding-block: 36px 6px; display: grid; gap: 16px; scroll-margin-top: 52px; }
.intro { color: var(--muted); max-width: 66ch; }

/* chips */
.sign { display: inline-flex; align-items: center; gap: 4px; background: var(--sign); color: var(--sign-ink); border-radius: 4px; padding: 2px 7px 1px; font: 600 0.78rem/1.4 var(--mono); white-space: nowrap; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.35); }
.tag { display: inline-block; background: var(--chip); color: var(--muted); border-radius: 3px; padding: 2px 6px 1px; font: 700 0.72rem/1.4 var(--display); letter-spacing: 0.05em; text-transform: uppercase; white-space: nowrap; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
.st { font: 800 0.7rem/1.4 var(--display); letter-spacing: 0.07em; text-transform: uppercase; white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; }
.st::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.st.confirmed { color: var(--ok); } .st.corrected { color: var(--ridge); } .st.unconfirmed, .st.pending { color: var(--warn); } .st.searched { color: var(--muted); }

/* book */
.book { display: grid; gap: 10px; }
.bk { background: var(--card); border: 1px solid var(--rule); border-left: 4px solid var(--steel); border-radius: 6px; padding: 12px 14px; display: grid; gap: 7px; min-width: 0; }
.bk.soft { border-left-color: var(--rule); }
.bk .top { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; justify-content: space-between; }
.bk .due { font: 600 0.82rem/1.35 var(--mono); color: var(--steel); }
.bk .fee { font: 600 0.82rem/1.35 var(--mono); color: var(--muted); }
.btns { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { display: inline-flex; align-items: center; min-height: 42px; padding: 8px 14px; border-radius: 5px; border: 1px solid var(--rule); background: var(--paper); color: var(--ink); font: 800 0.84rem/1 var(--display); letter-spacing: 0.03em; text-decoration: none; cursor: pointer; }
.btn.primary { background: var(--steel); border-color: var(--steel); color: #fff; }
.phone { font: 600 0.84rem/1 var(--mono); color: var(--muted); user-select: all; }

/* days */
.days { display: grid; gap: 10px; }
details.day { background: var(--card); border: 1px solid var(--rule); border-radius: 6px; }
details.day > summary { list-style: none; cursor: pointer; padding: 14px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: baseline; }
details.day > summary::-webkit-details-marker { display: none; }
details.day > summary::after { content: "+"; font: 800 1.3rem/1 var(--display); color: var(--muted); grid-row: 1 / span 2; grid-column: 2; align-self: center; }
details.day[open] > summary::after { content: "\2212"; }
details.day.is-today { border-color: var(--steel); box-shadow: inset 4px 0 0 var(--steel); }
.day .sun { font: 600 0.78rem/1.35 var(--mono); color: var(--muted); grid-column: 1; }
.day .body { padding: 0 14px 16px; display: grid; gap: 12px; }
.ledger { display: grid; gap: 8px; }
.opt { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; padding: 10px 12px; border: 1px solid var(--rule); border-radius: 5px; background: var(--paper); }
.opt .via { color: var(--muted); font-size: 0.88rem; grid-column: 1 / -1; }
.bar { height: 6px; border-radius: 3px; background: var(--chip); grid-column: 1 / -1; position: relative; overflow: hidden; }
.bar b { position: absolute; inset: 0 auto 0 0; background: var(--steel); border-radius: 3px; }
.bar s { position: absolute; inset: 0 auto 0 0; background: var(--steel); opacity: 0.35; border-radius: 3px; text-decoration: none; }
.slot { display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 10px; }
.slot .t { font: 600 0.82rem/1.65 var(--mono); color: var(--steel); }
.slot .alt { color: var(--muted); font-size: 0.9rem; margin-top: 2px; }

/* maps */
.mapbox { background: var(--card); border: 1px solid var(--rule); border-radius: 6px; padding: 10px; display: grid; gap: 10px; }
.mapbox svg { width: 100%; height: auto; display: block; max-height: 78vh; }
.legend { display: flex; flex-wrap: wrap; gap: 6px; }
.legend button { min-height: 36px; display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--rule); background: var(--paper); color: var(--ink); font: 700 0.78rem/1.1 var(--display); cursor: pointer; text-align: left; }
.legend button[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.legend .sw { width: 18px; height: 4px; border-radius: 2px; flex: none; }
.legend .sw.dash { background-image: linear-gradient(90deg, currentColor 60%, transparent 60%) !important; background-size: 6px 4px; }
.pinpanel:empty { display: none; }
svg .state { fill: var(--land); stroke: var(--rule); stroke-width: 1.2; }
svg .route { fill: none; stroke-linecap: round; stroke-linejoin: round; transition: opacity 0.2s; }
svg .river { fill: none; stroke: var(--water); stroke-linecap: round; opacity: 0.8; }
svg .scenic { fill: none; stroke: var(--ink); stroke-linecap: round; opacity: 0.7; }
svg .rt-faint { fill: none; stroke: var(--muted); opacity: 0.35; }
svg .town circle { fill: var(--ink); }
svg text { font-family: var(--display); fill: var(--ink); paint-order: stroke; stroke: var(--card); stroke-linejoin: round; }
svg .base-mark { fill: var(--steel); stroke: var(--card); stroke-width: 3; }
svg .pin { cursor: pointer; }
svg .pin .hit { fill: transparent; }
svg .pin.dim { opacity: 0.12; pointer-events: none; }
svg .pin.on .core { stroke: var(--ink); stroke-width: 3; }

/* cards */
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chipbtn { min-height: 38px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--rule); background: var(--card); color: var(--ink); font: 700 0.8rem/1 var(--display); letter-spacing: 0.03em; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.chipbtn[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.search { flex: 1 1 200px; min-width: 0; min-height: 40px; border: 1px solid var(--rule); border-radius: 6px; padding: 8px 10px; background: var(--card); color: var(--ink); font: 400 0.95rem var(--body); }
.count { font: 600 0.78rem var(--mono); color: var(--muted); }
.cards { display: grid; gap: 10px; }
@media (min-width: 780px) { .cards { grid-template-columns: 1fr 1fr; } }
.card { background: var(--card); border: 1px solid var(--rule); border-radius: 6px; padding: 12px 14px; display: grid; gap: 8px; align-content: start; min-width: 0; scroll-margin-top: 70px; }
.card.flash { box-shadow: 0 0 0 2px var(--steel); }
.card .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.card h3 { font-size: 1.05rem; display: flex; gap: 8px; align-items: center; }
.card .claim { font-size: 0.94rem; }
.card dl { margin: 0; display: grid; gap: 4px; font-size: 0.88rem; }
.card dl div { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 8px; }
.card dt { font: 800 0.7rem/1.6 var(--display); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.card dd { margin: 0; }
.card details { font-size: 0.86rem; color: var(--muted); }
.card summary { cursor: pointer; font: 800 0.74rem/2 var(--display); letter-spacing: 0.05em; text-transform: uppercase; }
.card .srcs { margin: 4px 0 0; padding-left: 18px; }
.card .why { margin-top: 6px; border-left: 2px solid var(--ridge); padding-left: 8px; }
.links { display: flex; flex-wrap: wrap; gap: 4px 16px; font: 800 0.82rem/1.8 var(--display); letter-spacing: 0.02em; }
.mark { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; border-top: 1px dashed var(--rule); padding-top: 8px; }
.mark button { min-height: 36px; padding: 4px 10px; border-radius: 5px; border: 1px solid var(--rule); background: var(--paper); color: var(--ink); font: 800 0.76rem/1 var(--display); cursor: pointer; }
.mark button[aria-pressed="true"].did { background: var(--ok); border-color: var(--ok); color: #fff; }
.mark button[aria-pressed="true"].skip { background: var(--muted); border-color: var(--muted); color: var(--paper); }
.mark input { flex: 1 1 150px; min-width: 0; min-height: 36px; border: 1px solid var(--rule); border-radius: 5px; padding: 6px 8px; background: var(--paper); color: var(--ink); font: 400 0.86rem var(--body); }
.mark .saved { font: 600 0.72rem var(--mono); color: var(--muted); }
.sub { display: grid; gap: 10px; }
.sub > h3 { border-bottom: 1px solid var(--rule); padding-bottom: 6px; }
.more { justify-self: start; }
.empty { color: var(--muted); font-style: italic; }

/* hikes */
.tablewrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: 6px; background: var(--card); }
table { border-collapse: collapse; width: 100%; min-width: 660px; font-size: 0.88rem; }
th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--rule); vertical-align: top; }
th { font: 800 0.7rem/1.2 var(--display); letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); background: var(--paper); }
td.n { font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.diff { display: inline-block; min-width: 10px; }

/* know */
.know { display: grid; gap: 8px; }
.know .k { background: var(--card); border: 1px solid var(--rule); border-radius: 6px; padding: 10px 12px; display: grid; gap: 5px; }
.know .k.trap { border-left: 4px solid var(--warn); }

/* made */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.tile { border-top: 3px solid var(--ink); padding-top: 8px; display: grid; gap: 2px; }
.tile .n { font: 900 2rem/1 var(--display); font-variant-numeric: tabular-nums; }
.tile .l { font: 700 0.76rem/1.3 var(--display); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.steps { display: grid; gap: 10px; counter-reset: s; }
@media (min-width: 780px) { .steps { grid-template-columns: repeat(3, 1fr); } }
.step { background: var(--card); border: 1px solid var(--rule); border-radius: 6px; padding: 12px 14px; display: grid; gap: 4px; }
.step h3::before { counter-increment: s; content: counter(s) "  "; color: var(--steel); font-family: var(--mono); }
.catches { display: grid; gap: 8px; }
@media (min-width: 780px) { .catches { grid-template-columns: 1fr 1fr; } }
.catch { background: var(--card); border: 1px solid var(--rule); border-radius: 6px; padding: 12px 14px; display: grid; gap: 4px; }
footer { color: var(--muted); font-size: 0.84rem; border-top: 1px solid var(--rule); margin-top: 44px; padding-top: 14px; display: grid; gap: 6px; }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } .profile .line { stroke-dasharray: var(--len); stroke-dashoffset: var(--len); animation: draw 2.2s ease-out 0.2s forwards; } @keyframes draw { to { stroke-dashoffset: 0; } } }
</style>

<div class="wrap">
  <header class="hero" id="top"></header>
  <nav class="tabs" aria-label="Sections"><ul id="tabs"></ul></nav>
  <main id="main"></main>
  <footer id="foot"></footer>
</div>

<script>
(function () {
  'use strict'
  const G = JSON.parse(document.getElementById('guide-data').textContent)
  const P = G.plan; const M = G.map
  const $ = (s, el = document) => el.querySelector(s)
  const NS = 'http://www.w3.org/2000/svg'
  const h = (tag, attrs = {}, ...kids) => {
    const el = document.createElement(tag)
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue
      if (k === 'class') el.className = v
      else if (k === 'text') el.textContent = v
      else if (k === 'style') el.setAttribute('style', v)
      else if (k.startsWith('on')) el.addEventListener(k.slice(2), v)
      else el.setAttribute(k, v === true ? '' : v)
    }
    for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(String(kid)))
    return el
  }
  const s = (tag, attrs = {}, ...kids) => {
    const el = document.createElementNS(NS, tag)
    for (const [k, v] of Object.entries(attrs || {})) if (v != null) { if (k === 'text') el.textContent = v; else if (k.startsWith('on')) el.addEventListener(k.slice(2), v); else el.setAttribute(k, v) }
    for (const kid of kids.flat()) if (kid) el.append(kid)
    return el
  }
  const STATUS = { confirmed: 'Fact-checked', corrected: 'Corrected', unconfirmed: 'Call ahead', pending: 'Being checked', searched: 'Searched' }
  const statusEl = (st) => h('span', { class: 'st ' + st, text: STATUS[st] || st })
  const driveEl = (m) => (m ? h('span', { class: 'sign', title: 'Drive from the house', text: '→ ' + m }) : null)
  const CATCOL = { eat: 'var(--c-eat)', coffee: 'var(--c-coffee)', drink: 'var(--c-drink)', see: 'var(--c-see)', views: 'var(--c-views)', outdoors: 'var(--c-outdoors)' }
  const LEGCOL = { leg1: 'var(--l1)', leg2: 'var(--l2)', leg3: 'var(--l3)' }
  const fmt = (n) => Number(n).toLocaleString('en-US')
  /* SVG text and pins are sized in screen pixels, whatever the drawing's own width */
  const VIEW = Math.max(280, Math.min(document.querySelector('.wrap').clientWidth - 22, 880))
  const U = (W, px) => +(px * W / VIEW).toFixed(1)
  const mapsUrl = (it) => {
    if (it.geo && !it.geo.summit) return 'https://www.google.com/maps/search/?api=1&query=' + it.geo.lat + ',' + it.geo.lng
    return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent([it.name, it.areaLabel || '', it.state || ''].filter(Boolean).join(', '))
  }
  const todayIso = (() => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0') })()
  const todayDay = (P.days || []).find((d) => d.iso === todayIso) || null
  const tripStarted = P.days && P.days.length && todayIso >= P.days[0].iso

  /* ---------- shared checklist ---------- */
  const marks = new Map(); let db = null; let me = null; const markListeners = new Set()
  async function initStore() {
    if (!window.claude || !window.claude.use) return
    try {
      db = await window.claude.use('db')
      const user = await window.claude.use('user')
      if (user && user.id) me = await user.id()
      if (!db) return
      db.collection('marks').onSnapshot((snap) => {
        marks.clear()
        for (const d of snap.docs || []) marks.set(d.id, d.data ? d.data() : d)
        markListeners.forEach((fn) => fn())
      })
    } catch (e) { db = null }
  }
  async function saveMark(id, patch) {
    const cur = Object.assign({}, marks.get(id) || {}, patch, { by: me || null, at: new Date().toISOString() })
    marks.set(id, cur); markListeners.forEach((fn) => fn())
    if (!db) return false
    try { await db.doc('marks/' + id).set(cur); return true } catch (e) { return false }
  }
  function markRow(it) {
    const did = h('button', { class: 'did', 'aria-pressed': 'false', type: 'button', text: 'We did this' })
    const skip = h('button', { class: 'skip', 'aria-pressed': 'false', type: 'button', text: 'Skipped' })
    const note = h('input', { type: 'text', id: 'note-' + it.id, placeholder: 'One line, if it earned one', 'aria-label': 'Note for ' + (it.name || 'this place'), maxlength: '240' })
    const saved = h('span', { class: 'saved', 'aria-live': 'polite' })
    const paint = () => {
      const m = marks.get(it.id) || {}
      did.setAttribute('aria-pressed', String(m.status === 'did')); skip.setAttribute('aria-pressed', String(m.status === 'skip'))
      if (document.activeElement !== note) note.value = m.note || ''

  if (G.know && G.know.length) {
    const sec = addSection('know', 'Know before you go', P.knowIntro)
    for (const grp of P.knowGroups) {
      const ks = G.know.filter((k) => k.group === grp.id); if (!ks.length) continue
      const traps = ks.filter((k) => k.kind === 'trap'); const rest = ks.filter((k) => k.kind !== 'trap')
      const det = h('details', { class: 'day', open: grp.id === P.knowGroups[0].id ? true : null }, h('summary', {}, h('div', {}, h('div', { class: 'eyebrow', text: `${traps.length} to watch out for · ${rest.length} facts` }), h('h3', { text: grp.title }))))
      det.append(h('div', { class: 'body' }, h('div', { class: 'know' }, traps.concat(rest).map((k) => h('div', { class: 'k' + (k.kind === 'trap' ? ' trap' : '') },
        h('div', { class: 'row' }, k.kind === 'trap' ? h('span', { class: 'tag', text: 'Watch out' }) : null, statusEl(k.status)), h('p', { text: k.claim }),
        k.link ? h('a', { href: k.link, target: '_blank', rel: 'noopener', class: 'count', text: 'Source' }) : null)))))
      sec.append(det)
    }
  }

  if (G.made) {
    const D = G.made; const v = D.verdicts || {}
    const sec = addSection('made', 'How this guide was made', P.madeIntro)
    const tile = (n, l) => h('div', { class: 'tile' }, h('div', { class: 'n', text: fmt(n) }), h('div', { class: 'l', text: l }))
    sec.append(h('div', { class: 'tiles' }, tile(D.findings, 'Findings researched'), tile(D.sources, 'Sources cited'), tile(D.specialists, 'Specialist agents'), tile((v.confirmed || 0) + (v.weakened || 0), 'Fact-checked so far'), tile(v.weakened || 0, 'Corrected'), tile(v.refuted || 0, 'Thrown out')))
    sec.append(h('div', { class: 'steps' }, (P.madeSteps || []).map((st) => h('div', { class: 'step' }, h('h3', { text: st.title }), h('p', { class: 'muted', text: st.text })))))
    if (D.catches && D.catches.length) {
      sec.append(h('h3', { text: 'What the research caught' }))
      sec.append(h('div', { class: 'catches' }, D.catches.map((c) => h('div', { class: 'catch' }, h('div', { class: 'row' }, statusEl(c.status)), h('h3', { text: c.title }), h('p', { class: 'muted', text: c.text }), c.link ? h('a', { href: c.link, target: '_blank', rel: 'noopener', class: 'count', text: 'Source' }) : null))))
    }
    sec.append(h('p', { class: 'count', text: `${D.verifiedRuns} of ${D.runs} research runs fact-checked at build time.` }))
  }

  for (const [id, label] of sections) tabs.append(h('li', {}, h('a', { href: '#' + id, text: label })))
  const tabLinks = [...tabs.querySelectorAll('a')]
  const io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) tabLinks.forEach((a) => { const on = a.getAttribute('href') === '#' + e.target.id; a.setAttribute('aria-current', String(on)); if (on) a.scrollIntoView({ inline: 'nearest', block: 'nearest' }) }) }), { rootMargin: '-45% 0px -50% 0px' })
  sections.forEach(([id]) => io.observe(document.getElementById(id)))
  $('#foot').append(h('div', { class: 'brand' }, h('i', { text: 'L' }), 'The Lads Travel Co.'), ...P.footer.map((t) => h('p', { text: t })), h('p', { class: 'num', text: 'Built ' + G.builtOn + '. ' + G.counts }))
  initStore()
})()
</script>
